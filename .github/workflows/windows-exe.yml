name: Exe Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Tests, image jlink et exe (jpackage)
        run: mvn -B clean package javafx:jlink exec:exec@jpackage

      - name: Publier l'exe
        uses: actions/upload-artifact@v4
        with:
          name: TomcatChooser-windows
          path: target/dist/TomcatChooser/
