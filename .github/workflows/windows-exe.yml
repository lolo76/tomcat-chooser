name: Exe Windows

# Release : pousser un tag de version (ex. v1.0.0) construit l'exe et crée la release GitHub
# avec le zip en pièce jointe. Lancement manuel aussi possible (Actions > Exe Windows > Run workflow).
# Pas de build à chaque commit.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Version de l'exe
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" =~ ^v([0-9]+(\.[0-9]+){0,2})$ ]]; then
            echo "app=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "app=" >> "$GITHUB_OUTPUT"
          fi

      - name: Tests, image jlink et exe (jpackage)
        shell: bash
        run: |
          ARGS=""
          if [ -n "${{ steps.version.outputs.app }}" ]; then ARGS="-Dapp.version=${{ steps.version.outputs.app }}"; fi
          mvn -B clean package javafx:jlink exec:exec@jpackage $ARGS

      - name: Zip de l'exe
        shell: pwsh
        run: Compress-Archive -Path target/dist/TomcatChooser -DestinationPath target/TomcatChooser-windows.zip

      - name: Publier l'exe (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: TomcatChooser-windows
          path: target/dist/TomcatChooser/

      - name: Créer la release GitHub
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Tomcat Chooser ${{ github.ref_name }}
          files: target/TomcatChooser-windows.zip
          generate_release_notes: true
