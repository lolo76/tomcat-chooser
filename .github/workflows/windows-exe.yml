name: Exe Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Tests, image jlink et exe (jpackage)
        run: mvn -B clean package javafx:jlink exec:exec@jpackage

      - name: Publier l'exe
        uses: actions/upload-artifact@v4
        with:
          name: TomcatChooser-windows
          path: target/dist/TomcatChooser/

      # Exe portable en un seul fichier : module SFX 7-Zip (7zS2.sfx, extrait dans %TEMP% puis lance
      # TomcatChooser.exe) + archive 7z du dossier jpackage. L'icône Tomcat est posée sur le module
      # avant la concaténation, pour ne pas abîmer l'archive ajoutée à la fin.
      - name: Exe portable (un seul fichier)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force build-tools | Out-Null
          # SDK LZMA le plus récent : release GitHub de 7-Zip, sinon lien de la page sdk.html de 7-zip.org
          $headers = @{ Authorization = "Bearer $env:GITHUB_TOKEN" }
          $release = Invoke-RestMethod -Headers $headers https://api.github.com/repos/ip7z/7zip/releases/latest
          $asset = $release.assets | Where-Object { $_.name -match '^lzma\d+\.7z$' } | Select-Object -First 1
          if ($asset) {
            $url = $asset.browser_download_url
          } else {
            $page = Invoke-WebRequest https://www.7-zip.org/sdk.html
            $url = 'https://www.7-zip.org/' + ($page.Links.href | Where-Object { $_ -match 'lzma\d+\.7z$' } | Select-Object -First 1)
          }
          Write-Host "SDK LZMA : $url"
          Invoke-WebRequest $url -OutFile build-tools\lzma.7z
          7z x build-tools\lzma.7z -obuild-tools\lzma -y | Out-Null
          $sfx = Get-ChildItem -Recurse build-tools\lzma -Filter 7zS2.sfx | Select-Object -First 1
          if (-not $sfx) { Get-ChildItem -Recurse build-tools\lzma | Select-Object FullName; throw "7zS2.sfx introuvable" }
          Copy-Item $sfx.FullName build-tools\stub.exe
          Invoke-WebRequest https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe -OutFile build-tools\rcedit.exe
          build-tools\rcedit.exe build-tools\stub.exe --set-icon packaging\tomcat.ico `
            --set-version-string FileDescription "Tomcat Chooser" --set-version-string ProductName "Tomcat Chooser"
          Push-Location target\dist\TomcatChooser
          7z a -mx=7 ..\..\app.7z * | Out-Null
          Pop-Location
          New-Item -ItemType Directory -Force target\portable | Out-Null
          cmd /c copy /b build-tools\stub.exe + target\app.7z target\portable\TomcatChooser.exe
          Get-Item target\portable\TomcatChooser.exe | Select-Object Name, Length

      - name: Vérifier que l'exe portable démarre
        shell: pwsh
        run: |
          $p = Start-Process target\portable\TomcatChooser.exe -PassThru
          Start-Sleep -Seconds 25
          # L'appli extraite (et non le lanceur portable lui-même) doit tourner.
          $running = Get-Process | Where-Object { $_.ProcessName -like 'TomcatChooser*' -and $_.Path -and $_.Path -notlike '*target\portable*' }
          Get-Process | Where-Object { $_.ProcessName -like 'TomcatChooser*' } | Select-Object ProcessName, Id, Path | Format-Table -AutoSize
          if (-not $running) { throw "TomcatChooser ne tourne pas après 25 s" }
          Get-Process | Where-Object { $_.ProcessName -like 'TomcatChooser*' } | Stop-Process -Force

      - name: Publier l'exe portable
        uses: actions/upload-artifact@v4
        with:
          name: TomcatChooser-portable
          path: target/portable/TomcatChooser.exe
